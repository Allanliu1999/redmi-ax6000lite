name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
  watch:
    types: started

permissions:
  contents: write

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Show system
      run: |
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'

    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile 2>/dev/null || true
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq install libfuse-dev
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds and custom packages
      run: |
        cd openwrt
        ./scripts/feeds install -a
        git clone --depth 1 https://github.com/immortalwrt/homeproxy.git package/homeproxy
        ./scripts/feeds install homeproxy 2>/dev/null || true

    - name: Update Golang
      run: |
        cd openwrt
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        mkdir -p openwrt/files/etc/opkg
        cat > openwrt/files/etc/opkg/customfeeds.conf << 'OPKGEOF'
        src/gz immortalwrt_base https://mirrors.tuna.tsinghua.edu.cn/immortalwrt/24.10/mediatek/mt7986/base
        src/gz immortalwrt_luci https://mirrors.tuna.tsinghua.edu.cn/immortalwrt/24.10/mediatek/mt7986/luci
        src/gz immortalwrt_packages https://mirrors.tuna.tsinghua.edu.cn/immortalwrt/24.10/mediatek/mt7986/packages
        src/gz immortalwrt_target https://mirrors.tuna.tsinghua.edu.cn/immortalwrt/24.10/mediatek/mt7986/targets
        OPKGEOF
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) V=s 2> /dev/null || make -j1 V=s 2> /dev/null
        echo "status=success" >> $GITHUB_OUTPUT
        DEVICE=$(grep 'xiaomi_redmi-router-ax6000-ubootmod' .config | grep '=y' | sed -r 's/.*DEVICE_(.*)=y/\1/')
        echo "DEVICE_NAME=_${DEVICE}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Get next version
      id: version
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2> /dev/null || echo "redmi_ax6000_v0")
        echo "最新 release tag: $LATEST_TAG"
        LATEST_NUM=$(echo "$LATEST_TAG" | grep -oP 'v\K\d+' || echo "0")
        echo "最新版本数字: $LATEST_NUM"
        NEXT_NUM=$((LATEST_NUM + 1))
        VERSION_TAG="redmi_ax6000_v${NEXT_NUM}"
        echo "当前生成版本: $VERSION_TAG"
        echo "release_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
        echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
        echo "VERSION_NUM=v${NEXT_NUM}" >> $GITHUB_ENV

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        TARGET_DIR="openwrt/bin/targets"
        if [ ! -d "$TARGET_DIR" ] || [ -z "$(ls -A $TARGET_DIR/*/* 2>/dev/null)" ]; then
          echo "错误：固件目录不存在或为空"
          exit 1
        fi
        cd openwrt/bin/targets/*/*
        VERSION_NUM="${{ env.VERSION_NUM }}"
        DATE_TAG=$(date +"%Y%m%d")
        KEPT_FILE=""
        for f in *; do
          if [ -f "$f" ]; then
            if echo "$f" | grep -q 'sysupgrade.bin'; then
              NEW_NAME=$(echo "$f" | sed "s/squashfs-sysupgrade\.bin/squashfs-sysupgrade-${VERSION_NUM}-${DATE_TAG}.bin/")
              mv "$f" "$NEW_NAME"
              echo "固件保留: $NEW_NAME"
              KEPT_FILE="$NEW_NAME"
            else
              rm -f "$f"
            fi
          fi
        done
        ls -lh *.bin 2> /dev/null
        rm -rf packages 2> /dev/null
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "KEPT_FILE=${KEPT_FILE}" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release info
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION_TAG="${{ env.VERSION_TAG }}"
        KEPT_FILE="${{ env.KEPT_FILE }}"
        FIRMWARE_DIR="${{ env.FIRMWARE }}"
        FW_FILE_INFO=""
        if [ -n "$KEPT_FILE" ] && [ -f "${FIRMWARE_DIR}/${KEPT_FILE}" ]; then
          FW_SIZE=$(ls -lh "${FIRMWARE_DIR}/${KEPT_FILE}" | awk '{print $5}')
          FW_FILE_INFO="  - ${KEPT_FILE} (${FW_SIZE})"
        fi
        PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2> /dev/null || echo "")
        if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$VERSION_TAG" ]; then
          CHANGELOG=$(git log --oneline --no-decorate "$PREV_TAG"..HEAD 2> /dev/null || echo "  - 首次发布")
        else
          CHANGELOG="  - 首次发布"
        fi
        {
          echo "## 🚀 Redmi AX6000 固件发布"
          echo ""
          echo "版本号： ${VERSION_TAG}"
          echo "固件名： ${KEPT_FILE}"
          echo "发布日期： $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          echo "源码分支： openwrt-24.10-6.6"
          echo ""
          echo "### 🔄 版本更新内容"
          echo "${CHANGELOG}"
          echo ""
          echo "### 📦 固件文件"
          echo "${FW_FILE_INFO:-  *(未找到固件文件)}"
          echo ""
          echo "### 🔧 包含插件"
          echo "- luci-app-nikki (Mihomo 代理)"
          echo "- luci-app-homeproxy"
          echo "- luci-app-turboacc-mtk (硬件加速)"
          echo "- luci-app-mtwifi-cfg (闭源WiFi管理)"
          echo "- luci-app-eqos-mtk (设备限速)"
          echo ""
          echo "### 🇨🇳 国内 opkg 源已配置"
          echo "刷机后可直接运行："
          echo "opkg update && opkg upgrade"
          echo ""
          echo "### 📝 说明"
          echo "- 基于 ImmortalWrt 24.10 闭源驱动"
          echo "- 分区类型：ubootmod"
          echo "- 使用 GitHub Actions 自动编译"
          echo "- 刷机前请备份配置"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 30
        keep_minimum_runs: 5
