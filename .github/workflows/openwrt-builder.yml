name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
  watch:
    types: started

permissions:
  contents: write

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Show system
      run: |
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'

    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile 2>/dev/null || true
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq install libfuse-dev
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds and custom packages
      run: |
        cd openwrt
        ./scripts/feeds install -a
        git clone --depth 1 https://github.com/nikkinikki-org/OpenWrt-nikki.git package/nikki
        git clone --depth 1 https://github.com/immortalwrt/homeproxy.git package/homeproxy

    - name: Update Golang
      run: |
        cd openwrt
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang

    - name: Pin sing-box to v1.12.25 (homeproxy 所需)
      run: |
        cd openwrt
        # 替换 feeds 中的 sing-box 为指定版本
        rm -rf feeds/packages/net/sing-box 2>/dev/null
        git clone --depth 1 https://github.com/sbwml/openwrt_pkgs -b sing-box-1.12.25 package/sing-box 2>/dev/null || {
          echo "sbwml sing-box 仓库不存在指定分支，尝试修改 feeds Makefile 版本号"
          sed -i 's/PKG_VERSION:=.*/PKG_VERSION:=1.12.25/' feeds/packages/net/sing-box/Makefile 2>/dev/null || true
          sed -i 's/PKG_HASH:=.*/# PKG_HASH overridden for pinned version/' feeds/packages/net/sing-box/Makefile 2>/dev/null || true
        }
        echo "sing-box 版本已固定"

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        mkdir -p openwrt/files/etc/opkg
        cat > openwrt/files/etc/opkg/customfeeds.conf << 'OPKGEOF'
        src/gz immortalwrt_core https://mirrors.vsean.net/openwrt/releases/24.10-SNAPSHOT/targets/mediatek/filogic/packages
        src/gz immortalwrt_base https://mirrors.vsean.net/openwrt/releases/24.10-SNAPSHOT/packages/aarch64_cortex-a53/base
        src/gz immortalwrt_luci https://mirrors.vsean.net/openwrt/releases/24.10-SNAPSHOT/packages/aarch64_cortex-a53/luci
        src/gz immortalwrt_packages https://mirrors.vsean.net/openwrt/releases/24.10-SNAPSHOT/packages/aarch64_cortex-a53/packages
        src/gz immortalwrt_routing https://mirrors.vsean.net/openwrt/releases/24.10-SNAPSHOT/packages/aarch64_cortex-a53/routing
        src/gz immortalwrt_telephony https://mirrors.vsean.net/openwrt/releases/24.10-SNAPSHOT/packages/aarch64_cortex-a53/telephony
        OPKGEOF
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep 'xiaomi_redmi-router-ax6000-ubootmod' .config | grep '=y' | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Get next version
      id: version
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 查找符合当前命名格式 (immortalwrt-redmi_ax6000_v{N}_YYYYMMDD) 且版本号合理 (< 100) 的旧 release
        # 旧格式的 release (redmi_ax6000_v1780733003) 会被忽略，自动从 V1 开始
        ALL_TAGS=$(gh release list --limit 20 --json tagName --jq '.[].tagName' 2> /dev/null || echo "")
        LATEST_TAG=$(echo "$ALL_TAGS" | grep -E '^immortalwrt-redmi_ax6000_v[0-9]+_' | while read tag; do
          NUM=$(echo "$tag" | grep -oP 'v\K\d+')
          if [ -n "$NUM" ] && [ "$NUM" -lt 100 ] 2>/dev/null; then
            echo "$tag"
          fi
        done | head -1 || echo "")
        if [ -z "$LATEST_TAG" ]; then
          echo "未找到匹配的旧 release，从 V1 开始"
          NEXT_NUM=1
        else
          echo "最新 release tag: $LATEST_TAG"
          LATEST_NUM=$(echo "$LATEST_TAG" | grep -oP 'v\K\d+')
          echo "最新版本数字: $LATEST_NUM"
          NEXT_NUM=$((LATEST_NUM + 1))
        fi
        VERSION_TAG="immortalwrt-redmi_ax6000_v${NEXT_NUM}_$(date +"%Y%m%d")"
        echo "当前生成版本: $VERSION_TAG"
        echo "release_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
        echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
        echo "VERSION_NUM=v${NEXT_NUM}" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/*/*
        VERSION_NUM="${{ env.VERSION_NUM }}"
        DATE_TAG=$(date +"%Y%m%d")
        echo "版本号: ${VERSION_NUM}, 日期: ${DATE_TAG}"

        for f in *; do
          if [ -f "$f" ]; then
            case "$f" in
              *sysupgrade.bin | *initramfs-recovery.itb | *initramfs-factory.ubi)
                NEW_NAME=$(echo "$f" | sed "s/\.bin$/-${VERSION_NUM}-${DATE_TAG}.bin/" | sed "s/\.itb$/-${VERSION_NUM}-${DATE_TAG}.itb/" | sed "s/\.ubi$/-${VERSION_NUM}-${DATE_TAG}.ubi/")
                mv "$f" "$NEW_NAME"
                echo "保留: $NEW_NAME"
                ;;
              *)
                rm -f "$f"
                echo "删除: $f"
                ;;
            esac
          fi
        done

        echo "=== 最终固件列表 ==="
        ls -lh
        rm -rf packages 2> /dev/null
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release info
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        VERSION_TAG="${{ env.VERSION_TAG }}"
        FIRMWARE_DIR="${{ env.FIRMWARE }}"

        FW_LIST=""
        if [ -d "$FIRMWARE_DIR" ]; then
          FW_LIST=$(ls -lh "$FIRMWARE_DIR" 2> /dev/null | grep -v "^total" | awk '{print "  - " $NF " (" $5 ")"}')
        fi

        cat > release.txt << EOF
        ## 🚀 Redmi AX6000 固件发布

        **版本号：** ${VERSION_TAG}
        **发布日期：** $(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M")

        ### 📦 固件文件
        ${FW_LIST}

        ### 📝 固件说明
        - **sysupgrade.bin** — 常规升级用（通过 LuCI 或 ssh 刷写）
        - **initramfs-recovery.itb** — 恢复/救砖用（通过 U-Boot 刷写）
        - **initramfs-factory.ubi** — 首次刷机/工厂复位用

        ### 🔧 包含插件
        - luci-app-nikki (Mihomo 代理)
        - luci-app-homeproxy
        - luci-app-upnp (UPnP IGD + PCP/NAT-PMP)
        - luci-app-turboacc-mtk (硬件加速)
        - luci-app-mtwifi-cfg (闭源WiFi管理)
        - luci-app-eqos-mtk (设备限速)

        ### 🇨🇳 国内 opkg 源已配置
        使用 vsean.net 镜像源，刷机后可直接运行：
        opkg update

        ### 📝 说明
        - 基于 ImmortalWrt 24.10 闭源驱动
        - 分区类型：ubootmod
        - 使用 GitHub Actions 自动编译
        - 刷机前请备份配置
        EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.release_tag }}
        name: ${{ steps.version.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        fail_on_unmatched_files: false
        draft: false
        prerelease: false
        make_latest: true

    # ---- 编译成功后，清理所有之前失败的 Action 记录（成功的保留） ----
    - name: Clean up previous failed workflow runs
      if: success() && steps.compile.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== 列出所有失败的 workflow 运行记录（保留成功的不删） ==="
        FAILED_RUNS=$(gh run list --limit 50 --json databaseId,conclusion,createdAt --jq '.[] | select(.conclusion == "failure") | .databaseId' 2>/dev/null)
        if [ -n "$FAILED_RUNS" ]; then
          echo "$FAILED_RUNS" | while read run_id; do
            echo "删除失败记录 #${run_id}"
            gh run delete "$run_id" 2>/dev/null || true
          done
          echo "✅ 已清理所有失败的运行记录"
        else
          echo "✅ 没有失败的记录需要清理"
        fi
